name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Python (pipeline) ----
      - uses: astral-sh/setup-uv@v5
      - name: Python lint + format check
        run: |
          uv sync --frozen --group dev
          uv run ruff check pipeline/ tests/
          uv run ruff format --check pipeline/ tests/
      - name: Python test
        run: uv run pytest

      # ---- Rust (backend) ----
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust fmt
        working-directory: app/backend
        run: cargo fmt --check
      - name: Rust test
        working-directory: app/backend
        run: cargo test
      - name: Rust build
        working-directory: app/backend
        run: cargo build --release

      # ---- Frontend (web app) ----
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Frontend install
        working-directory: app/frontend
        run: npm ci
      - name: Frontend lint
        working-directory: app/frontend
        run: npm run lint
      - name: Frontend build
        working-directory: app/frontend
        run: npm run build

  image:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner | lower }}/musical-color:${{ github.sha }}
            ghcr.io/${{ github.repository_owner | lower }}/musical-color:latest
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v2
        with:
          package-name: musical-color
          package-type: container
          min-versions-to-keep: 6
          token: ${{ secrets.GHCR_TOKEN }}
