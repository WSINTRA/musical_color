# Runs as the non-root `app` user (see Dockerfile). pid/logs/temp paths are in
# /tmp because the container runs unprivileged and port 3000 is >1024.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
  worker_connections 512;
}

http {
  access_log /tmp/nginx-access.log;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  client_body_temp_path /tmp/nginx-cb;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-ff;
  uwsgi_temp_path /tmp/nginx-uw;
  scgi_temp_path /tmp/nginx-scgi;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 3000;
    server_name _;

    root /app/dist;
    index index.html;

    # Single-page-app fallback: unknown paths serve the Vite-built index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # API + audio clips are served by the Rust backend (127.0.0.1:3001).
    location /api/ {
      proxy_pass http://127.0.0.1:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /clips/ {
      proxy_pass http://127.0.0.1:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }
}
